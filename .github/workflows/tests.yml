name: Tests

on:
  pull_request:
  push:

jobs:
  # Check if there are any changes to important code files
  check-for-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    outputs:
      run_full_tests: ${{ steps.set-outputs.outputs.run_full_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check for relevant file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            relevant:
              - 'Code/**'
              - 'tests/**'
              - '.github/**'
              - 'Distribution/**'
              
      - name: Set test execution flag
        id: set-outputs
        run: |
          if [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run_full_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full_tests=false" >> "$GITHUB_OUTPUT"
          fi

  # Run Ubuntu tests when relevant changes detected
  test-ubuntu:
    name: Test Ubuntu
    runs-on: ubuntu-latest
    container: simvascular/libraries:latest
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.run_full_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Ubuntu tests
        uses: ./.github/actions/test-ubuntu
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Run macOS tests when relevant changes detected
  test-macos:
    name: Test macOS
    runs-on: macos-latest
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.run_full_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run macOS tests
        uses: ./.github/actions/test-macos

  test-windows:
    name: Test Windows
    runs-on: windows-2022
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.run_full_tests == 'true' }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # meshio 5.3.5 expects Base64 decoding to stop at padding.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit # MSYS2 provides only make, gfortran, and mpif90 for the genBC tests.
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-msmpi
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: svmp
          create-args: -c conda-forge vtk-base=9.7.0 vtk-io-ffmpeg=9.7.0 tbb-devel openblas libblas=*=*openblas msmpi
          init-shell: none
      - name: Use the conda-forge dependencies
        run: |
          prefix="$(cygpath -m "$MAMBA_ROOT_PREFIX")/envs/svmp/Library"
          echo "DEPENDENCY_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "MSMPI_INC=$(cygpath -w "$prefix/include")" >> "$GITHUB_ENV"
          echo "MSMPI_LIB64=$(cygpath -w "$prefix/lib")" >> "$GITHUB_ENV"
          cygpath -w "$prefix/bin" >> "$GITHUB_PATH"
          mkdir -p build/licenses
          shopt -s globstar # micromamba nests its package cache by download URL.
          for licenses in "$(cygpath -u "$MAMBA_ROOT_PREFIX")"/pkgs/**/info/licenses; do
            package="${licenses%/info/licenses}"
            cp -r "$licenses" "build/licenses/${package##*/}"
          done
      - name: Restore Trilinos
        id: trilinos
        uses: actions/cache/restore@v4
        with:
          path: C:/trilinos
          key: windows-trilinos-16.2.2
      - name: Build Trilinos
        if: steps.trilinos.outputs.cache-hit != 'true'
        run: |
          git -c core.symlinks=false -c core.autocrlf=false clone -q --depth 1 --branch trilinos-release-16-2-2 https://github.com/trilinos/Trilinos.git /c/t/s
          cd /c/t/s
          cp COPYRIGHT Copyright.txt # TriBITS reads this file, which is a symbolic link in the repository.
          # Add the type qualifications that MSVC requires.
          sed -i 's/^\( *\)MultiVecAdapter<Kokkos::View\(.*::node_t>\)/\1typename MultiVecAdapter<Kokkos::View\2/' packages/amesos2/src/Amesos2_KokkosMultiVecAdapter_def.hpp
          sed -i 's/^typename Xpetra::CrsMatrix<\(.*getLocalMatrixHost() const\)/typename BlockedCrsMatrix<\1/' packages/xpetra/src/BlockedCrsMatrix/Xpetra_BlockedCrsMatrix_def.hpp
          cmake -S . -B /c/t/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:/trilinos \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_CXX_FLAGS="-EHsc -bigobj -permissive- -DNOMINMAX" \
            -DTrilinos_ENABLE_{Teuchos,Kokkos,KokkosKernels,Tpetra,Belos,Ifpack2,Amesos2,Xpetra,MueLu,EXPLICIT_INSTANTIATION}=ON \
            -DTrilinos_ENABLE_{Fortran,TESTS,EXAMPLES,ALL_OPTIONAL_PACKAGES}=OFF -DTpetra_INST_INT_INT=ON -DTpetra_INST_INT_LONG_LONG=OFF \
            -DTPL_ENABLE_MPI=ON -DMPI_GUESS_LIBRARY_NAME=MSMPI -DMPI_USE_COMPILER_WRAPPERS=OFF -DMPI_EXEC="$DEPENDENCY_PREFIX/bin/mpiexec.exe" \
            -DTPL_ENABLE_DLlib=OFF -DTPL_{BLAS,LAPACK}_LIBRARIES="$DEPENDENCY_PREFIX/lib/openblas.lib"
          cmake --build /c/t/b --target install --parallel 4
          curl -fsSL --create-dirs https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt -o /c/trilinos/licenses/LGPL-2.1.txt # Amesos2's KLU2
          cp --parents LICENSE COPYRIGHT packages/{amesos2,belos,ifpack2,muelu,teuchos,tpetra,xpetra}/{LICENSE,COPYRIGHT} \
            packages/{kokkos,kokkos-kernels}/{LICENSE,Copyright.txt} packages/amesos2/src/{KLU2,basker}/{LICENSE,COPYRIGHT} \
            packages/amesos2/src/KLU2/Doc/KLU_README.txt /c/trilinos/licenses
          echo "svmultiphysics.exe links these Trilinos 16.2.2 packages statically. Their source is at" \
            "https://github.com/trilinos/Trilinos/tree/trilinos-release-16-2-2, and .github/workflows/tests.yml in" \
            "https://github.com/SimVascular/svMultiPhysics shows how to build them and relink the solver." > /c/trilinos/licenses/SOURCE.txt
      - uses: actions/cache/save@v4
        if: steps.trilinos.outputs.cache-hit != 'true'
        with:
          path: C:/trilinos
          key: ${{ steps.trilinos.outputs.cache-primary-key }}
      - name: Restore PETSc
        id: petsc
        uses: actions/cache/restore@v4
        with:
          path: C:/petsc
          key: windows-petsc-3.26.0
      - uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6
        if: steps.petsc.outputs.cache-hit != 'true'
        with:
          packages: make python3 # PETSc configures MSVC builds only in Cygwin.
          add-to-path: false
      - name: Build PETSc
        if: steps.petsc.outputs.cache-hit != 'true'
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
        run: |
          export PATH="/usr/bin:$PATH"
          export PATH="$(dirname "$(command -v cl)"):$PATH" # MSVC's link.exe must precede Cygwin's.
          dependencies="$(cygpath -u "$DEPENDENCY_PREFIX")"
          cd /cygdrive/c
          curl -fsSL https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-3.26.0.tar.gz | tar xz
          cd petsc-3.26.0
          ./configure --prefix=/cygdrive/c/petsc PETSC_ARCH=arch-mswin-c-opt --with-cc=cl --with-cxx=cl --with-fc=0 \
            --with-shared-libraries=0 --with-debugging=0 --with-strict-petscerrorcode \
            'CFLAGS=-GF -MD -wd4996 -Zc:preprocessor' 'CXXFLAGS=-GF -MD -GR -EHsc -wd4996 -Zc:preprocessor' COPTFLAGS=-O2 CXXOPTFLAGS=-O2 \
            --with-mpi-include="$dependencies/include" --with-mpi-lib="$dependencies/lib/msmpi.lib" \
            --with-mpiexec="$dependencies/bin/mpiexec" --with-blaslapack-lib="$dependencies/lib/openblas.lib"
          make PETSC_DIR="$PWD" PETSC_ARCH=arch-mswin-c-opt all
          make PETSC_DIR="$PWD" PETSC_ARCH=arch-mswin-c-opt install
          install -D LICENSE /cygdrive/c/petsc/licenses/LICENSE
      - uses: actions/cache/save@v4
        if: steps.petsc.outputs.cache-hit != 'true'
        with:
          path: C:/petsc
          key: ${{ steps.petsc.outputs.cache-primary-key }}
      - name: Build the 0D interface
        run: |
          git clone https://github.com/SimVascular/svZeroDSolver.git
          git -C svZeroDSolver checkout 62aecfece16302879257dc4b6a8a93ea19ebf19d
          cmake -S svZeroDSolver -B svZeroDSolver/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_PROJECT_svZeroDSolver_INCLUDE="$PWD/Code/ThirdParty/eigen/share/eigen3/cmake/Eigen3Config.cmake" \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$PWD/Code/ThirdParty/eigen"
          cmake --build svZeroDSolver/build --target svzero_interface --parallel 4
      - name: Configure
        run: |
          cp -r /c/trilinos/licenses build/licenses/trilinos
          cp -r /c/petsc/licenses build/licenses/petsc
          cmake -S Code -B build/windows -G Ninja \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DMPI_GUESS_LIBRARY_NAME=MSMPI \
            -DSV_PACKAGE_RUNTIME_DIRS="$DEPENDENCY_PREFIX/bin" -DSV_PACKAGE_LICENSE_DIRS="$PWD/build/licenses/" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DSV_USE_MSMPI=ON -DSV_USE_TRILINOS=ON -DTrilinos_DIR=C:/trilinos/lib/cmake/Trilinos -DSV_PETSC_DIR=C:/petsc -DBLA_VENDOR=OpenBLAS \
            -DENABLE_UNIT_TEST=ON -DSV_ENABLE_DISTRIBUTION=ON -DSV_INSTALLER_TYPE=ZIP \
            -DSV_PACKAGE_EXTRA_LIBRARIES="$PWD/svZeroDSolver/build/src/interface/libsvzero_interface.dll" \
            -DSV_PACKAGE_EXTRA_LICENSES="$PWD/svZeroDSolver/LICENSE.txt"
      - name: Build and run unit tests
        run: |
          cmake --build build/windows --parallel 4 -- -k 0 2>&1 | tee build/windows/build.log
          ctest --test-dir build/windows/Source/solver --verbose 2>&1 | tee build/windows/unit-tests.log
      - name: Package
        run: |
          git rev-parse HEAD > build/windows/source-revision.txt
          "$(cygpath -u "$MAMBA_EXE")" list -n svmp > build/windows/dependencies.txt
          grep -h 'set(CMAKE_CXX_COMPILER\(_ID\|_VERSION\)\? ' build/windows/CMakeFiles/*/CMakeCXXCompiler.cmake > build/windows/toolchain.txt
          cpack --config build/windows/CPackConfig.cmake -G ZIP -B build/windows-packages 2>&1 | tee build/windows/cpack.log
      - name: Run numerical tests
        run: |
          export SVMP_EXECUTABLE="$(cygpath -w "$PWD/build/windows/bin/svmultiphysics.exe")"
          export SVMP_EXECUTABLE_PETSC="$SVMP_EXECUTABLE"
          export MPIEXEC_EXECUTABLE="$(cygpath -w "$DEPENDENCY_PREFIX/bin/mpiexec.exe")"
          windows_python="$(cygpath -u "$pythonLocation")/python.exe"
          "$windows_python" -m pip install pytest numpy meshio==5.3.5 pandas
          cd tests
          "$windows_python" -m pytest -v -rf --junitxml=../build/windows/integration.xml 2>&1 | tee ../build/windows/integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            build/windows-packages/*.zip
            build/windows/*.txt
            build/windows/*.log
            build/windows/*.xml

  test-windows-package:
    name: Test Windows ZIP
    runs-on: windows-2022
    timeout-minutes: 15
    needs: test-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools and MPI runtime
        shell: pwsh
        run: |
          python -m pip install pytest numpy meshio==5.3.5
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          git lfs pull --include='tests/cases/fluid/pipe_RCR_3d/**,tests/cases/fluid/pipe_RCR_sv0D/**'
          if ($LASTEXITCODE) { throw 'Test data download failed' }
          $installer = "$env:RUNNER_TEMP/msmpisetup.exe"
          Invoke-WebRequest https://download.microsoft.com/download/7/2/7/72731ebb-b63c-4170-ade7-836966263a8f/msmpisetup.exe -OutFile $installer
          if ((Get-FileHash $installer).Hash -ne '47443829114d8d8670f77af98939fe876d33eceb35d0ce4e0e85efeec4d87213') { throw 'MPI installer checksum mismatch' }
          $result = Start-Process $installer -ArgumentList '-unattend' -Wait -PassThru
          if ($result.ExitCode -notin 0,3010) { throw "MPI installation failed: $($result.ExitCode)" }
      - name: Run the extracted package without development tools on PATH
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem package -Recurse -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one solver ZIP' }
          $destination = "$env:RUNNER_TEMP/solver package with spaces"
          Expand-Archive $archives[0].FullName $destination
          $license = Get-ChildItem $destination -Recurse -Filter LICENSE.txt | Where-Object { $_.Directory.Name -eq 'svMultiPhysics' }
          if (!$license -or (Get-FileHash $license.FullName).Hash -ne (Get-FileHash LICENSE.txt).Hash) { throw 'Missing or incorrect project license' }
          $env:SVMP_EXECUTABLE = (Get-ChildItem $destination -Recurse -Filter svmultiphysics.exe).FullName
          $library = (Get-ChildItem $destination -Recurse -Filter libsvzero_interface.dll).FullName
          $inputFile = Join-Path $PWD 'tests/cases/fluid/pipe_RCR_sv0D/solver.xml'
          [xml]$inputXml = Get-Content $inputFile
          $inputXml.SelectSingleNode('//Shared_library').InnerText = $library
          $inputXml.Save($inputFile)
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;C:\Program Files\Microsoft MPI\Bin"
          $env:MPIEXEC_EXECUTABLE = 'C:\Program Files\Microsoft MPI\Bin\mpiexec.exe'
          $env:OPENBLAS_NUM_THREADS = '1'
          $env:OMP_NUM_THREADS = '1'
          Set-Location tests
          & $python -m pytest -v test_fluid.py::test_pipe_RCR_3d test_fluid.py::test_pipe_RCR_sv0D test_fluid.py::test_pipe_restart_with_spaces test_fluid.py::test_pipe_output_error --junitxml=package-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-tests
          path: tests/package-tests.xml

  # Single coordinating job for branch protection rules
  # This job succeeds if:
  # 1. Tests are skipped (no relevant changes) OR
  # 2. All platform tests pass
  # This job fails only if tests actually fail
  all-tests:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [check-for-changes, test-ubuntu, test-macos, test-windows, test-windows-package]
    if: always()
    steps:
      - name: Determine results of tests
        run: |
          # If tests were skipped, the job should succeed
          if [ "${{ needs.check-for-changes.outputs.run_full_tests }}" = "false" ]; then
            echo "✅ Tests were skipped - no relevant changes detected"
            exit 0
          fi
          
          # If tests were supposed to run, check if they passed
          if [ "${{ needs.check-for-changes.outputs.run_full_tests }}" = "true" ]; then
            if [ "${{ needs.test-ubuntu.result }}" = "success" ] && [ "${{ needs.test-macos.result }}" = "success" ] && [ "${{ needs.test-windows.result }}" = "success" ] && [ "${{ needs.test-windows-package.result }}" = "success" ]; then
              echo "✅ All tests passed successfully"
              exit 0
            else
              echo "❌ One or more tests failed"
              echo "Ubuntu test result: ${{ needs.test-ubuntu.result }}"
              echo "macOS test result: ${{ needs.test-macos.result }}"
              echo "Windows test result: ${{ needs.test-windows.result }}"
              echo "Windows package test result: ${{ needs.test-windows-package.result }}"
              exit 1
            fi
          fi
